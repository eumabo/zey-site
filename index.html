<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="ZEY — uma experiência visual cinematográfica.">
  <title>ZEY</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="assets/preview.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <script src="site-config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page" aria-label="ZEY — experiência cinematográfica">
    <section class="frame" id="frame" aria-label="Paisagem cinematográfica">
      <div class="visual" aria-hidden="true">
        <img class="poster" id="poster" src="assets/preview.webp" alt="" decoding="async" fetchpriority="high">
        <video id="backgroundVideo" class="background-video" autoplay muted loop playsinline
          preload="metadata" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
      </div>

      <div class="topbar">
        <div class="identity">
          <span class="roman" aria-hidden="true">I.</span>
          <span class="rule" aria-hidden="true"></span>
          <nav class="micro-nav" id="microNav" aria-label="Links" hidden></nav>
        </div>

        <button id="fullscreenButton" class="pill-button" type="button" aria-label="Entrar em tela cheia" title="Tela cheia">
          <span class="pill-core" aria-hidden="true"></span>
        </button>
      </div>

      <div class="bottom-bar">
        <button id="soundButton" class="sound-button" type="button" aria-label="Ativar som" title="Ativar som">
          <svg class="speaker" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 5 6.2 9H3v6h3.2L11 19V5Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
            <path class="sound-wave wave-one" d="M14 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path class="sound-wave wave-two" d="M16.4 6.3a8 8 0 0 1 0 11.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path class="muted-cross" d="m16 10 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="ellipsis" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </section>
  </main>
  <!-- Autoplay com som é tentado; navegadores podem exigir uma interação. -->
  <audio id="ambientAudio" src="assets/ambient.mp3" preload="auto" loop autoplay></audio>
</body>
</html>

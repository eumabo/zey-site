<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="ZEY">
  <title>ZEY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #d8d8d8;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    main {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100svh;
      padding: 24px;
    }

    h1 {
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 300;
      letter-spacing: 0.38em;
      text-transform: lowercase;
      padding-left: 0.38em;
      opacity: 0;
      animation: appear 1.8s ease forwards;
      user-select: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
        filter: blur(4px);
      }

      to {
        opacity: 0.88;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 {
        opacity: 0.88;
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>take care</h1>
  </main>
</body>
</html>
